<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ISEP | ランディングページ</title>
    <meta name="description" content="ISEP プロジェクトの簡易ランディングページ" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9fafb;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #2563eb;
        --card: #ffffff;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f14;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --card: #121821;
          --border: #1f2937;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--fg);
        line-height: 1.6;
      }
      .container {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      .desc { color: var(--muted); margin: 0; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-top: 16px;
      }
      ul.links { list-style: none; padding: 0; margin: 0; }
      ul.links li { padding: 10px 0; border-top: 1px solid var(--border); }
      ul.links li:first-child { border-top: none; }
      a.link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a.link:hover { text-decoration: underline; }
      .note { color: var(--muted); font-size: .95rem; }
      footer { margin-top: 32px; color: var(--muted); font-size: .9rem; }
      code { background: rgba(127,127,127,.12); padding: .1em .35em; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ISEP ランディングページ</h1>
        <p class="desc">プロジェクト内の主要なビューアページへのリンク集です。</p>
      </header>

      <section class="card" aria-labelledby="section-viewers">
        <h2 id="section-viewers" style="margin-top:0">ビューア</h2>
        <ul class="links">
          <li>
            <a class="link" href="viewer-advanced.html">高度なビューア</a>
            <div class="note">`viewer-advanced.html`</div>
          </li>
          <li>
            <a class="link" href="stakeholder_confirmation_paragraphs.html">利害関係者確認段落</a>
            <div class="note">`stakeholder_confirmation_paragraphs.html`</div>
          </li>
          <li>
            <a class="link" href="stakeholder_confirmation_from_db.html">利害関係者確認段落v.2</a>
            <div class="note">`stakeholder_confirmation_from_db.html`</div>
          </li>
        </ul>
      </section>

      <footer>
        <div>最終更新: <time id="last-updated"></time></div>
      </footer>
    </div>

    <script>
      // 軽い利便性: 表示時点の更新日時を表示
      (function() {
        try {
          const el = document.getElementById('last-updated');
          if (el) el.textContent = new Date().toLocaleString();
        } catch (_) {}
      })();
    </script>
  </body>
  </html>
