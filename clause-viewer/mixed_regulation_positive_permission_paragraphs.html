: null}, {"paragraph_id": 13554, "municipality": "松本市", "year": 2023, "category": "条例", "dan_number": 48, "text": "第15条 設置許可を受けた設置事業者(以下「許可事業者」という。)は、当該設置許可の内容の変更をしようとするときは、あらかじめ、市長に申請し、許可(以下「変更許可」という。)を受けなければならない。ただし、規則で定める軽微な変更については、この限りでない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 18093, "municipality": "内子町", "year": 2023, "category": "条例", "dan_number": 24, "text": "第13条 事業者は、本町において事業を実施しようとするとき、又は本町において実施している事業を変更しようとするときは、事業の着手前までに町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 18098, "municipality": "内子町", "year": 2023, "category": "条例", "dan_number": 29, "text": "4 町長は、第1項の規定による同意には、この条例の目的を達成するために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 14043, "municipality": "掛川市", "year": 2023, "category": "条例", "dan_number": 25, "text": "1 事業者は、市内において再生可能エネルギー発電事業を実施しようとするときは、市長に協議し、その同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 14046, "municipality": "掛川市", "year": 2023, "category": "条例", "dan_number": 28, "text": "4 市長は、第1項の同意をする場合において、必要であると認めるときは、この条例の目的を達成するため必要な限度において、条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 14047, "municipality": "掛川市", "year": 2023, "category": "条例", "dan_number": 29, "text": "5 前各項の規定は、第2項又は第3項の規定により市長が同意した再生可能エネルギー発電事業の変更(規則で定める軽微な変更を除く。以下同じ。)をしようとするときについて準用する。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 15982, "municipality": "秩父市", "year": 2023, "category": "条例", "dan_number": 48, "text": "第11条 事業者は、太陽光発電事業を行おうとするとき又は実施している事業を変更しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 14245, "municipality": "蔵王町", "year": 2023, "category": "条例", "dan_number": 38, "text": "第13条 事業者は、町内において事業を実施しようとするとき、又は実施している事業を変更しようとするときは、町長の category": "条例", "dan_number": 38, "text": "3 市長は、同意に際し、自然環境等の保全及び災害による被害の防止のために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 16962, "municipality": "白石市", "year": 2023, "category": "条例", "dan_number": 61, "text": "2 市長は、次の各号のいずれかに該当すると認められるときは、事業者に対して、期限を定めて必要な措置を講ずるよう勧告することができる。(1) 第11条の規定による届出を行わないとき、又は届出の内容に虚偽があるとき。(2) 第12条第1項の規定による市長の同意を得ずに事業に着手したとき。(3) 前条第1項の規定による報告若しくは資料の提出をせず、又は虚偽の報告若しくは資料の提出をしたとき。(4) 前条第1項の規定による立入調査を拒み、若しくは妨げ、又は忌避したとき。(5) 前条第1項の規定による立入調査の際に質問に答弁せず、又は虚偽の答弁をしたとき。(6) 正当な理由がなく前項の規定による助言又は指導に従わなかったとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 17992, "municipality": "宮古市", "year": 2023, "category": "条例", "dan_number": 58, "text": "第21条 営業譲渡、合併、分割その他の事由により、地域主導型再生可能エネルギー事業を承継しようとする者は、市長の承認を受けて、地域主導型再生可能エネルギー事業者が有していた当該事業の認定に基づく地位を承継することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 20205, "municipality": "西予市", "year": 2021, "category": "条例", "dan_number": 27, "text": "2 事業者は、第8条第2項ただし書に該当する禁止区域、又は第9条第2項各号に規定する抑制区域において事業を行おうとするときは、前項の届出により市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 21824, "municipality": "松田町", "year": 2021, "category": "施行規則", "dan_number": 26, "text": "第9条 営業譲渡、合併、分割その他の事由により、地域主導型事業を承継したものは、町長の承認を受けて、当該地域主導型事業の認定を承継することができる。(2) 地域主導型事業の全部又は一部を休止し、又は廃止したとき。(3) 地域主導型事業が、第5条第2項に掲げる要件を満たさないと認められるとき。(4) 認定事業者が、第7条各号のいずれかに該当したとき。(6) 認定事業者が、条例又はこの規則に違反したとき。(1) 太陽光発電を行う事業者(再生可能エネルギー設備の設置及び管理等に要する敷地面積の合計が建物の屋根部分を除いて3000平方メートル以上であるものに限る。)。(2) 50キロワット以上の定格出力をもつ発電目的の再生可能エネルギー設備の設置を行う事業者。(3) 300平方メートル以上の集熱面積をもつ太陽熱利用設備の設置を行う事業者。(4) 土砂災害警戒区域その他の生活環境に重大な影響を及ぼすおそれがあると町長が別に定める区域に再生可能エネルギー設備の設置を行う事業者。(5) その他環境に影響を及ぼすおそれがあると町長が判断する再生可能エネルギー設備の設置を行う事業者。(1) 事業者の名称及び主たる所在地。(2) 再生可能エネルギー設備を設置する場所。(3) 設置する再生可能エネルギー設備。(4) その他町長が必要と認める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 21830, "municipality": "松田町", "year": 2021, "category": "施行規則", "dan_number": 32, "text": "第13条 条例第14条の立入調査を行う職員は、その身分を示す証明書を携帯し、関係者に提示しなければならない。(1) 町長は、再生可能エネルギー事業の実施又は継続に必要な町長の許可、認可又は認定等(以下「許可等」という。)の審査に際し、当該事業を行う者が条例第15条第1項の勧告に従わなかったという事実を考慮することができる。(2) 町長は、再生可能エネルギー事業の実施又は継続に必要な許可等の権限を有する者に対し、当該事業を行う者が条例第15条第1項の勧告に従わなかったという事実を通知し、許可等の審査に際し、当該通知の内容について考慮するよう要請することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 24479, "municipality": "南島原市", "year": 2020, "category": "条例", "dan_number": 40, "text": "第13条 事業者は、保全地区内において事業を行おうとするとき、又は事業区域の面積が0.5ヘクタールを超える事業(事業者が行おうとする事業に係る事業区域の面積と、規則で定める当該事業区域と同一の事業区域とみなす区域の面積とを合算した面積が0.5ヘクタールを超えるものを含む。)を行おうとするときは、事業区域ごとに事業計画を定め、当該事業計画について市長の許可を受けなければならない。ただし、次に掲げる事業については、この限りでない。(1) 建築基準法(昭和25年法律第201号)第2条第1号に規定する建築物の屋根又は屋上に太陽光発電設備を設置する事業。(2) 工場立地法(昭和34年法律第24号)第4条第1項第1号の規定に基づく環境施設として太陽光発電施設を設置する事業", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 24483, "municipality": "南島原市", "year": 2020, "category": "条例", "dan_number": 44, "text": "4 市長は、前条第1項の規定による許可において、自然環境若しくは景観の維持又は災害若しくは生活環境への被害等の発生の防止のために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 24524, "municipality": "南島原市", "year": 2020, "category": "条例", "dan_number": 85, "text": "第29条 市長は、許可事業者が次の各号のいずれかに該当するときは、当該許可を取り消すことができる。(4) 第14条第1項に規定する要件を満たさない事業を行ったとき。(6) 第15条第1項に規定する変更の許可を受けないで事業を行ったとき。(7) 次条第1項の規定による命令に違反したとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 24526, "municipality": "南島原市", "year": 2020, "category": "条例", "dan_number": 87, "text": "第30条 市長は、許可事業者が当該許可(第15条第1項の規定による変更の許可を受けた者にあっては、その許可)を受けた事業計画に従って事業を行っていないと認めるときは、当該許可事業者に対し、工事その他の行為の停止を命じ、又は相当の期限を定めて、太陽光発電設備の除却、事業区域の原状回復その他違反を是正するため必要な措置を採ることを命ずることができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 25223, "municipality": "湯河原町", "year": 2020, "category": "条例", "dan_number": 28, "text": "第12条 事業者は、事業を実施しようとするとき又は実施している事業を変更しようとするときは、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 25227, "municipality": "湯河原町", "year": 2020, "category": "条例", "dan_number": 32, "text": "5 町長は、同意の際、この条例の目的を達成するために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 26295, "municipality": "真庭市", "year": 2015, "category": "条例", "dan_number": 22, "text": "3 事業者は、市内において事業の工事に着手しようとするとき又は第1項の規定により届け出た事項を変更しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 26615, "municipality": "富士宮市", "year": 2015, "category": "条例", "dan_number": 23, "text": "3 事業者は、市内において事業を施行しようとするとき、又は市内において施行している事業を変更しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 26947, "municipality": "大桑村", "year": 2016, "category": "条例", "dan_number": 27, "text": "第９条 事業者は、村内において事業を施行しようとするときは、当該事業に着手しようとする90日前までに、次に掲げる事項を村長に届け出て、村長の同意を得なけれならない。(１) 事業者の氏名及び住所（法人その他の団体にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地）。(２) 事業の着手予定日及び完了予定日。(３) 事業区域の所在地及び面積。(４) 事業内容。(５) 前各号に定めるもののほか規則で定める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 26948, "municipality": "大桑村", "year": 2016, "category": "条例", "dan_number": 28, "text": "２ 事業者は、前項の規定により届け出た事項に変更が生じたときは、速やかにその旨を村長に届け出て、村長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28128, "municipality": "愛南町", "year": 2016, "category": "条例", "dan_number": 22, "text": "2 事業者は、発電事業の工事の着手前に町長に届け出て、許可を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28182, "municipality": "木曽町", "year": 2016, "category": "条例", "dan_number": 21, "text": "1 事業者は、町内において事業を施行しようとするときは、当該事業に着手しようとする日の90日前までに、次に掲げる事項を届け出て、町長の同意を得なければならない。(1) 事業者の氏名及び住所(法人にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地。第15条第1項において同じ。)。(2) 事業の着手予定日及び完了予定日。(3) 事業区域の所在地及び面積。(4) 事業の内容。(5) 該当自治会への説明会に係る報告書。(6) 近隣関係者への説明に係る報告書。(7) 前各号に定めるもののほか規則で定める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28184, "municipality": "木曽町", "year": 2016, "category": "条例", "dan_number": 23, "text": "3 事業者は、第1項第2号から第4号に掲げる事項の変更をしようとするときは、あらかじめ、その旨を届け出て、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39195, "municipality": "木曽町", "year": 2019, "category": "条例", "dan_number": 21, "text": "第9条 事業者は、町内において事業を施行しようとするときは、当該事業に着手しようとする日の90日前までに、次に掲げる事項を届け出て、町長の同意を得なければならない。(1) 事業者の氏名及び住所(法人にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地。第15条第1項において同じ。)。(2) 事業の着手予定日及び完了予定日。(3) 事業区域の所在地及び面積。(4) 事業の内容。(5) 該当自治会への説明会に係る報告書。(6) 近隣関係者への説明に係る報告書。(7) 前各号に定めるもののほか規則で定める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39197, "municipality": "木曽町", "year": 2019, "category": "条例", "dan_number": 23, "text": "3 事業者は、第1項第2号から第4号に掲げる事項の変更をしようとするときは、あらかじめ、その旨を届け出て、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28562, "municipality": "大津市", "year": 2017, "category": "条例", "dan_number": 16, "text": "第7条 第5条の規定により設置を禁止される場合を除くほか、特定事業を実施しようとする者は、当該特定事業に係る工事(以下「設置工事」という。)に着手する前に、当該特定事業に係る計画(以下「事業計画」という。)を定め、市長の許可を受けなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28591, "municipality": "大津市", "year": 2017, "category": "条例", "dan_number": 45, "text": "2 市長は、第7条第1項の許可に、災害の防止又は良好な自然環境等の保全のため必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28594, "municipality": "大津市", "year": 2017, "category": "条例", "dan_number": 48, "text": "第13条 第7条第1項の許可を受けた者(以下「許可事業者」という。)は、当該許可に係る事業計画を変更しようとするときは、あらかじめ、規則で定めるところにより、市長の許可を受けなければならない。ただし、規則で定める軽微な変更をしようとするときは、この限りでない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 28603, "municipality": "大津市", "year": 2017, "category": "条例", "dan_number": 57, "text": "第16条 市長は、許可事業者が次の各号のいずれかに該当するときは、当該許可を取り消すことができる。(3) 第7条第1項の許可を受けた日から起算して1年を経過した日までに設置工事に着手しなかったとき。(4) 1年以上引き続き設置工事を施行していないとき。(5) 第12条第1項第1号に掲げる要件を満たさないと認められるに至ったとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 29038, "municipality": "安中市", "year": 2017, "category": "条例", "dan_number": 25, "text": "第8条 設置者は、市内において前条第1項各号のいずれかの要件に該当する太陽光発電設備の設置をしようとするときは、規則で定めるところにより、当該設置に係る工事を開始しようとする日の60日前までに次に掲げる事項を記載した届出書を市長に提出した上、当該設置に係る市長の同意を得なければならない。(1) 設置者の氏名及び住所(設置者が法人である場合にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地とする。)。(2) 太陽光発電設備の設置に係る工事の開始予定日及び完了予定日。(3) 設置区域の所在地及び面積。(4) 太陽光発電設備の設置に伴う土砂災害に対する対策及び生活環境の保全に係る対策の内容。(5) 前各号に定めるもののほか、規則で定める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 29040, "municipality": "安中市", "year": 2017, "category": "条例", "dan_number": 27, "text": "3 市長は、第1項の同意には、当該同意に係る設置区域の周辺の災害の発生の防止及び生活環境の保全のため必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 29217, "municipality": "飯豊町", "year": 2017, "category": "条例", "dan_number": 15, "text": "3 エネルギー事業者は、町内においてエネルギー事業の工事を施工しようとするとき、又は町内において施工しているエネルギー事業の工事を変更しようとするときは、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31086, "municipality": "松川村", "year": 2018, "category": "施行規則", "dan_number": 31, "text": "3 前項の同意書に同意を必要とするものの範囲は，村長が別に定める。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32310, "municipality": "松川村", "year": 2018, "category": "条例", "dan_number": 77, "text": "2 村長は，前項の承認をしようとするときは，あらかじめその旨を公告し，承認案を2週間縦覧に供しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32311, "municipality": "松川村", "year": 2018, "category": "条例", "dan_number": 78, "text": "3 村長は，第1項の承認をしたときは，事業者にその旨を通知しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32312, "municipality": "松川村", "year": 2018, "category": "条例", "dan_number": 79, "text": "4 村長は，第1項の承認をしないときは，理由を附し規則の定めるところにより，開発事業に係る協議を継続する旨を通知しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32327, "municipality": "松川村", "year": 2018, "category": "条例", "dan_number": 94, "text": "2 村長は，完了検査の結果，承認の内容と検査結果が適合しない場合は，期限を定め改善するよう指導又は勧告することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31189, "municipality": "上島町", "year": 2018, "category": "条例", "dan_number": 15, "text": "第7条 事業者は、事業を行うときは、あらかじめ、次に掲げる事項について、町長に書類を提出し、町長の許可を受けなければならない。(1) 上島町内に事業所を設けることを証明する書類。(2) 事業者の氏名及び住所(法人その他の団体にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地)。(3) 事業を行う位置及び事業の計画を明らかにする図書。(4) 事業区域及びその周辺の状況を示す写真。(5) 事業に係る設計又は施工方法を明らかにする図書。(6) 該当自治会の説明会に係る報告書。(7) 近隣関係者への説明に係る報告書。(8) 他法令による許認可等を受けている場合はその許可書の写し", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31213, "municipality": "上島町", "year": 2018, "category": "条例", "dan_number": 39, "text": "第18条 町長は、許可事業者が次の各号のいずれかに該当するときは、その許可を取り消すことができる。(1) 正当な理由なく第7条第1項の規定による書類の提出をせず、又は虚偽の書類を提出したとき。(2) 第13条第1項の規定による指導又は助言に応じないとき。(3) 第14条第1項の規定による通知を受ける前に事業に着手したとき。(4) 偽りその他不正の手段により、許可を受けたとき。(5) 第8条第2項の規定により許可に付した条件に違反したとき。(6) 許可を受けてから起算して1年を経過した日までに設置工事に着手しなかったとき。(7) 設置工事に着手した日後1年を超える期間引き続き設置工事を行っていないとき。(8) 第8条第1項に掲げる要件を満たさないと認められるに至ったとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31980, "municipality": "常陸太田市", "year": 2018, "category": "条例", "dan_number": 40, "text": "第13条 設置者は、次の各号のいずれかに該当する場合は、設置事業に着手しようとする日の30日前までに、市規則で定めるところにより、市長に申請し、その許可を受けなければならない。(1) 次のいずれかに該当する太陽光発電設備を設置する場合。ア 発電出力が50キロワット以上(分割案件で合算して50キロワット以上のものを含む。)のもの。イ 事業区域の面積が500平方メートル以上のもの。ウ 地上高が最大4メートル以上のもの。(2) 発電出力が20キロワット以上の風力発電設備を設置する場合。(3) 発電出力が10キロワット以上のバイオマス発電設備を設置する場合。(4) 第7条第1項の規定により指定された抑制区域に発電設備を設置する場合", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31981, "municipality": "常陸太田市", "year": 2018, "category": "条例", "dan_number": 41, "text": "2 事業者は、設置許可の内容の変更を行おうとするときは、市規則で定めるところにより、速やかに市長に変更の許可(以下「変更許可」という。)の申請を行い、あらかじめ市長の許可を受けなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32679, "municipality": "筑北村", "year": 2018, "category": "条例", "dan_number": 41, "text": "第12条 事業者は、太陽光発電設備設置事業の実施について、次条第1項に規定する協定の締結前に、自治会等の代表者及び事業区域から100m以内の区域にある土地、建築物、工作物の所有者、占有者、管理者又は借主並びに事業の実施に伴い影響を受けることが懸念される農林水産業を営む者の同意書を村長に提出しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31550, "municipality": "生坂村", "year": 2018, "category": "施行規則", "dan_number": 41, "text": "別図中「農業振興区域」については自治会及び近隣関係者が当該事業に同意した場合は、村長は同意するものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33389, "municipality": "生坂村", "year": 2018, "category": "条例", "dan_number": 23, "text": "第９条 事業者は、村内において事業を施行しようとするときは、当該事業に着手しようとする日の60日前までに、次に掲げる事項を届け出て、村長の同意を得なければならない。(１) 事業者の氏名及び住所（法人にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地。第15条第１項において同じ。）。(２) 事業の着手予定日及び完了予定日。(３) 事業区域の所在地及び面積。(４) 事業の内容。(５) 該当自治会への説明会に係る報告書。(６) 近隣関係者への説明に係る報告書。(７) 前各号に定めるもののほか規則で定める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33391, "municipality": "生坂村", "year": 2018, "category": "条例", "dan_number": 25, "text": "３ 事業者は、第１項第２号から第４号に掲げる事項の変更をしようとするときは、あらかじめ、その旨を届け出て、村長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31718, "municipality": "東伊豆町", "year": 2018, "category": "施行規則", "dan_number": 19, "text": "第9条 条例第12条第1項に規定する規則で定める基準とは、次に掲げるものをいう。ア 太陽光発電設備設置事業を実施するために必要な資力及び信用があると認められない場合。イ 成年被後見人若しくは被保佐人又は破産者で復権を得ない者である場合。ウ 拘禁刑以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から5年を経過しない場合。エ 暴力団員による不正な行為の防止等に関する法律(平成3年法律第77号)第2条第6号に規定する暴力団員(以下この項において「暴力団員」という。)又は暴力団員でなくなった日から5年を経過しない者(以下この項において「暴力団員等」という。)である場合。カ 暴力団員等がその事業活動を支配する場合。(2) 東伊豆町土地利用事業の適正化に関する指導要綱(平成2年東伊豆町要綱第4号)に基づく町長の承認を得ていること。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32815, "municipality": "東伊豆町", "year": 2018, "category": "条例", "dan_number": 29, "text": "第11条 事業者は、町内において太陽光発電設備設置事業を実施しようとするとき、又は町内において実施している太陽光発電設備設置事業を変更しようとするときは、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32819, "municipality": "東伊豆町", "year": 2018, "category": "条例", "dan_number": 33, "text": "2 町長は、同意の際、自然環境の保全又は災害若しくは生活環境への被害等の防止のために必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31871, "municipality": "伊東市", "year": 2018, "category": "条例", "dan_number": 48, "text": "第１１条　事業者は、市内において太陽光発電設備設置事業を実施しようとするとき、又は市内において実施している太陽光発電設備設置事業を変更しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 31873, "municipality": "伊東市", "year": 2018, "category": "条例", "dan_number": 50, "text": "３　市長は、第１項の同意には、この条例の目的を達成するために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32607, "municipality": "木祖村", "year": 2018, "category": "条例", "dan_number": 26, "text": "3 事業者は、村内において事業を施行しようとするとき又は村内において施行している事業を変更しようとするときは、村長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32988, "municipality": "神戸市", "year": 2018, "category": "条例", "dan_number": 33, "text": "第8条 事業者は、次に掲げる区域(当該区域に事業区域の一部が含まれる場合における当該事業区域の全部を含む。)において特定事業を実施しようとするとき(第6条ただし書の規定により禁止区域を事業区域とすることが認められて特定事業を実施しようとするときを含む。)は、特定施設の設置に着手する前に、市長の許可を受けなければならない。(1) 斜度30度以上の勾配を有する土地を含む区域。(2) 都市計画法(昭和43年法律第100号)第7条第3項に規定する市街化調整区域。(3) 都市計画法第9条第1項に規定する第1種低層住居専用地域。(4) 都市計画法第9条第2項に規定する第2種低層住居専用地域。(5) 都市計画法第9条第3項に規定する第1種中高層住居専用地域。(6) 都市計画法第9条第4項に規定する第2種中高層住居専用地域。(7) 都市計画法第9条第5項に規定する第1種住居地域。(8) 都市計画法第9条第6項に規定する第2種住居地域。(9) 都市計画法第9条第8項に規定する田園住居地域。(11) 鉄道用地又は道路用地(市長が指定する鉄道又は道路に係るものに限る。)の敷地境界線に隣接する区域のうち規則で定める区域", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32989, "municipality": "神戸市", "year": 2018, "category": "条例", "dan_number": 34, "text": "2 前項の許可を受けようとする者は、事業計画が記載された書類(以下「事業計画書」という。)その他規則で定める書類を添付した許可申請書を市長に提出しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32992, "municipality": "神戸市", "year": 2018, "category": "条例", "dan_number": 37, "text": "2 市長は、前条第1項の許可に、災害の発生の防止又は良好な自然環境若しくは生活環境の保全のため必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32993, "municipality": "神戸市", "year": 2018, "category": "条例", "dan_number": 38, "text": "3 市長は、前条第1項の許可の申請に対して、許可の決定又は許可をしない決定をしたときは、その旨を当該申請を行った者に通知するものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 32996, "municipality": "神戸市", "year": 2018, "category": "条例", "dan_number": 41, "text": "第10条 第8条第1項の許可を受けた者(以下「許可事業者」という。)は、当該許可に係る事業計画を変更しようとするときは、当該変更に伴い生じる工事に着手する前に、規則で定めるところにより、市長の許可を受けなければならない。ただし、次に掲げる変更をしようとするときは、この限りでない。(1) 特定施設の設置に係る規則で定める軽微な変更。(2) 特定施設の維持管理の方法に係る変更。(3) 特定施設を廃止した後の措置の方法に係る変更", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33565, "municipality": "伊豆市", "year": 2018, "category": "条例", "dan_number": 41, "text": "第８条 事業者は、事業を実施しようとするときは、当該事業に着手しようとする60日前までに、次に掲げる事項を届け出て市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33575, "municipality": "伊豆市", "year": 2018, "category": "条例", "dan_number": 51, "text": "２ 事業者は、前項の規定により届け出た同項各号に掲げる事項に変更が生ずるときは、規則で定めるところにより、あらかじめ、その旨を届け出て市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33576, "municipality": "伊豆市", "year": 2018, "category": "条例", "dan_number": 52, "text": "３ 市長は、前２項の同意には、この条例の目的を達成するために必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33934, "municipality": "恵那市", "year": 2018, "category": "施行規則", "dan_number": 50, "text": "5 市長は、事業の実施に同意するときは、次の各号に掲げる事項について条件を付すことができる。(1) 施工中の安全に関する事項。(2) 同意の期限に関する事項。(3) その他市長が必要と認める事項", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 33961, "municipality": "恵那市", "year": 2018, "category": "施行規則", "dan_number": 77, "text": "2 項の規定により市長の承認を受けようとする者は、太陽光発電設備設置事業地位承継承認申請書(様式第22号)を市長に提出しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 34160, "municipality": "恵那市", "year": 2018, "category": "条例", "dan_number": 45, "text": "2 前条第1項の協定を締結した事業者から事業区域内の土地の所有権その他太陽光発電設備設置事業に関する工事を実施する権限を取得した者は、市長の承認を受けて、当該事業者が有していた事業の同意及び協定に基づく地位を承継する。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 35893, "municipality": "御宿町", "year": 2019, "category": "条例", "dan_number": 35, "text": "第12条　事業者は、町内において事業を施行しようとするとき、又は町内において施行している事業を変更しようとするときは、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 35897, "municipality": "御宿町", "year": 2019, "category": "条例", "dan_number": 39, "text": "２　町長は、同意の際、自然環境若しくは景観の維持又は災害若しくは生活環境への被害等の発生の防止のために必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36538, "municipality": "函南町", "year": 2019, "category": "条例", "dan_number": 26, "text": "3 事業者は、町内において事業を実施しようとするとき又は町内において実施している事業を変更しようとするときは、町長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36539, "municipality": "函南町", "year": 2019, "category": "条例", "dan_number": 27, "text": "4 町長は、前項の同意には、この条例の目的を達成するために必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37999, "municipality": "朝日村", "year": 2019, "category": "条例", "dan_number": 23, "text": "2 事業者は、前項の規定による説明会を開催し同意を得た時は、その内容を村長に報告するものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36427, "municipality": "島田市", "year": 2019, "category": "条例", "dan_number": 23, "text": "第９条 事業者は、設置工事に着手しようとするときは、当該設置工事に着手しようとする日の60日前までに規則で定めるところにより申請し、市長の同意を得なければならない。事業を変更しようとするとき(当該変更の内容が軽微であると市長が認めるときを除く。)も、同様とする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36429, "municipality": "島田市", "year": 2019, "category": "条例", "dan_number": 25, "text": "３ 市長は、第１項の同意の際、災害若しくは生活環境への被害等の発生の防止、又は自然環境、景観若しくは都市環境の維持のために必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37100, "municipality": "伊豆の国市", "year": 2019, "category": "条例", "dan_number": 25, "text": "第10条 事業者は、次の各号のいずれかに該当するときは、市長の同意を得なければならない。(1) 市内において事業を実施しようとするとき。(2) 市内において実施している事業を変更しようとするとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37102, "municipality": "伊豆の国市", "year": 2019, "category": "条例", "dan_number": 27, "text": "3 市長は、第1項の同意をするにあたり必要な条件を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36954, "municipality": "那須町", "year": 2019, "category": "条例", "dan_number": 20, "text": "第9条 設置事業者は、太陽光発電設備の最大発電量が抑制区域内又は抑制区域を含む区域内にあっては10キロワット以上、抑制区域外にあっては50キロワット以上の事業用発電設備で事業を行おうとするときは、当該事業区域に係る設置事業に関する計画(以下「設置事業計画」という。)を定め、当該設置事業計画について町長の許可(以下「設置許可」という。)を受けなければならない。ただし、次に掲げる設置事業については、この限りでない。(1) 建築基準法(昭和25年法律第201号)第2条第1号に規定する建築物の屋根又は屋上に設置する設置事業。(2) 工場立地法(昭和34年法律第24号)第4条第1項第1号に規定する環境施設として太陽光発電施設を設置する設置事業", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 36979, "municipality": "那須町", "year": 2019, "category": "条例", "dan_number": 45, "text": "第18条 町長は、許可事業者又は変更許可を受けた許可事業者(以下「許可事業者等」という。)が次の各号のいずれかに該当するときは、その許可を取り消すことができる。(1) 偽りその他不正な手段により、設置許可又は変更許可を受けたとき。(2) 設置許可又は変更許可を受けた日から起算して1年を経過する日までに当該設置許可に係る設置事業に着手しなかったとき。(3) 設置許可又は変更許可を受け、当該許可に係る設置事業に着手した日後1年を超える期間引き続き設置事業を行っていないとき。(6) 前条第1項の規定に違反して変更許可を受けないで設置事業を行ったとき。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37007, "municipality": "那須町", "year": 2019, "category": "条例", "dan_number": 73, "text": "第30条 町長は、設置事業計画又は変更許可を受けた設置事業計画に従って事業を実施していないと認めるときは、許可事業者等に対し、相当の期限を定めて、必要な措置を講ずることを勧告することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37010, "municipality": "那須町", "year": 2019, "category": "条例", "dan_number": 76, "text": "第31条 町長は、許可事業者等が、正当な理由なく、前条第1項の規定による勧告に従わないときは、許可事業者等に対し、工事その他の行為の停止を命じ、又は相当の期限を定めて太陽光発電設備の除却、事業区域の原状回復その他の違反を是正するため必要な措置を講ずることを命ずることができる。(1) 当該許可の取消し又は命令を受けた者の氏名及び住所(法人にあっては、名称、代表者の氏名及び主たる事務所の所在地)。(2) 当該許可の取消し又は命令の内容", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37198, "municipality": "瀬戸市", "year": 2019, "category": "条例", "dan_number": 41, "text": "第10条 事業者は、設置事業のうち、発電出力の合計が1,000キロワット以上の太陽光発電設備を設置する事業(以下「大規模設備設置事業」という。)を実施しようとするときは、規則で定めるところにより、あらかじめ、市長に同意の申請をしなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37200, "municipality": "瀬戸市", "year": 2019, "category": "条例", "dan_number": 43, "text": "3 市長は、第1項の規定による同意の申請に関し、規則で定める基準に基づく審査が終了したときは、同意又は不同意を決定し、その結果を速やかに事業者に通知しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 37606, "municipality": "大玉村", "year": 2019, "category": "条例", "dan_number": 18, "text": "第8条 事業者は、第6条に規定する太陽光発電設備を設置しようとするときは、次に掲げる事項を記載した事前届出書を村長に提出し、同意を得なければならない。(1) 事業区域の所在及び面積。(2) 事業者の氏名及び住所(法人にあっては、その名称及び代表者の氏名並びに主たる事務所の所在地)。(3) 太陽光発電設備の設置に着手する予定日及び設置が完了する予定日。(4) 太陽光発電設備の設置完了時における土地の形状及び設置する位置。(5) 太陽光発電設備の設置に係る設計及び構造。(6) 太陽光発電設備の発電出力及び太陽電池の合計出力。(7) 排水その他土砂等の流出を防止する施設の計画。(8) 自然環境、景観及び生活環境の調和のための措置。(9) 前2号に掲げるもののほか、災害、事故等の発生防止のための措置。(10) 事業の施行に必要な法令及び他の条例の許認可取得や手続きの有無の確認状況。(11) 太陽光発電設備の保守点検及び維持管理計画。(12) 太陽光発電設備廃止時の撤去等費用の資金調達計画及び原状回復が担保される措置。(13) 地域における環境保全上の取組み。(14) 地域における経済振興等への関与及び効果", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39015, "municipality": "日高市", "year": 2019, "category": "条例", "dan_number": 27, "text": "第11条 事業者は、太陽光発電設備設置事業を行おうとするときは、市長の同意を得るものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39017, "municipality": "日高市", "year": 2019, "category": "条例", "dan_number": 29, "text": "3 市長は、第1項の同意には、この条例の目的を達成するために必要な意見を付することができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39300, "municipality": "袋井市", "year": 2019, "category": "条例", "dan_number": 35, "text": "第12条 事業者は、市内において発電出力50キロワット以上の設備を設置し、再生可能エネルギー発電事業を実施しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39302, "municipality": "袋井市", "year": 2019, "category": "条例", "dan_number": 37, "text": "3 前2項の同意を得た事業を変更 (規則に定める軽微な変更を除く。)しようとするときは、市長の同意を得なければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39304, "municipality": "袋井市", "year": 2019, "category": "条例", "dan_number": 39, "text": "第13条 市長は、前条の規定による同意をする場合において、当該届出に係る再生可能エネルギー発電事業計画が規則で定める基準に適合していると認めるときは、同意する。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39305, "municipality": "袋井市", "year": 2019, "category": "条例", "dan_number": 40, "text": "2 市長は、前項の規定により同意をするときは、自然環境若しくは景観の維持又は災害若しくは生活環境への被害等の発生の防止のために必要な条件を付すことができる。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39312, "municipality": "袋井市", "year": 2019, "category": "条例", "dan_number": 47, "text": "2 市長は、第12条の規定による同意を得た事業者から、前項の規定による届出があったときは、速やかに同意の基準及び付した条件等に適合していることを確認しなければならない。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39764, "municipality": "袋井市", "year": 2019, "category": "施行規則", "dan_number": 11, "text": "第5条 事業者は、条例第11条第1項の規定による届出及び条例第12条の規定による同意の申請の前に、市長と事前協議を行うものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}, {"paragraph_id": 39769, "municipality": "袋井市", "year": 2019, "category": "施行規則", "dan_number": 16, "text": "第6条 市長は、条例第12条の規定による同意の可否を決定したときは、再生可能エネルギー発電事業同意通知書(様式第6号) 又は再生可能エネルギー発電事業不同意通知書(様式第7号)により通知するものとする。", "code": "*CLAUSE_POSITIVE_PERMISSION_CONSENT", "code_description": null}];
        const tableBody = document.getElementById('tableBody');
        const totalCountEl = document.getElementById('totalCount');
        const displayCountEl = document.getElementById('displayCount');
        const searchInput = document.getElementById('searchInput');
        const thElements = Array.from(document.querySelectorAll('th.sortable'));

        let filteredData = [...data];
        let sortColumn = null;
        let sortAsc = true;

        function renderTable(rows) {
            tableBody.innerHTML = '';
            const fragment = document.createDocumentFragment();
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.paragraph_id ?? ''}</td>
                    <td style="text-align:left;">${row.municipality ?? ''}</td>
                    <td>${row.year ?? ''}</td>
                    <td style="text-align:left;">${row.category ?? ''}</td>
                    <td>${row.dan_number ?? ''}</td>
                    <td class="text-content">${(row.text ?? '').replace(/</g,'&lt;')}</td>
                    <td style="text-align:left;">${row.code ?? ''}</td>
                    <td style="text-align:left;">${row.code_description ?? ''}</td>
                `;
                fragment.appendChild(tr);
            });
            tableBody.appendChild(fragment);
            totalCountEl.textContent = data.length;
            displayCountEl.textContent = rows.length;
        }

        function initTable() { renderTable(filteredData); }

        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim().toLowerCase();
            filteredData = data.filter(row => {
                return Object.values(row).some(v => String(v || '').toLowerCase().includes(term));
            });
            renderTable(filteredData);
        });

        thElements.forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.column;
                const isAsc = sortColumn === column ? !sortAsc : true;
                filteredData.sort((a, b) => {
                    let aVal = a[column];
                    let bVal = b[column];
                    const aNum = parseFloat(aVal);
                    const bNum = parseFloat(bVal);
                    if (!isNaN(aNum) && !isNaN(bNum)) { aVal = aNum; bVal = bNum; }
                    if (aVal == null && bVal == null) return 0;
                    if (aVal == null) return isAsc ? -1 : 1;
                    if (bVal == null) return isAsc ? 1 : -1;
                    if (aVal < bVal) return isAsc ? -1 : 1;
                    if (aVal > bVal) return isAsc ? 1 : -1;
                    return 0;
                });
                sortColumn = column;
                sortAsc = isAsc;
                renderTable(filteredData);
            });
        });

        initTable();
    </script>
    </body>
    </html>
